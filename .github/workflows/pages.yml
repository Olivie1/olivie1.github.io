name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    env:
      VITE_API_URL: https://ibuki-back.onrender.com
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate public backend URL
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.VITE_API_URL);
            if (url.protocol !== "https:" || url.hostname === "localhost" || url.hostname === "127.0.0.1" || url.pathname !== "/" || url.search || url.hash) {
              throw new Error("Set VITE_API_URL to the public HTTPS backend origin, without /api");
            }
          '
      - run: npm run build
      - name: Add SPA fallback for direct QR links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
