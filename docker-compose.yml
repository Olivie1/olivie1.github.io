name: startup_project

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_PATH: /data/recovery.db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - recovery_data:/data
    networks:
      - recovery_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - recovery_network
    restart: unless-stopped

volumes:
  recovery_data:

networks:
  recovery_network:
    driver: bridge
